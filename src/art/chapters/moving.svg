    <ellipse cx="752" cy="744" rx="77" ry="73" fill="#0000FF" stroke="#000000" />
    <ellipse cx="512" cy="512" rx="77" ry="73" fill="none" stroke="#0000FF" stroke-width="10" stroke-dasharray="23 24" stroke-linecap="round" />
    <ellipse cx="752" cy="512" rx="77" ry="73" fill="#FF0000" stroke="#000000" />
  </g>
  <g id="jump-arrow" fill="#00FF00">
